              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HermesChannelSpec is a standalone messaging-platform binding referenced by a
              HermesAgent (v1beta1 surface; modeled here so the type is stable). v1 uses
              inline spec.channels. See specification §3.3.
            properties:
              enabled:
                default: true
                type: boolean
              ingress:
                description: ingress is only meaningful when webhookPort > 0.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      annotations are merged verbatim onto the Ingress object (nginx, Traefik,
                      cert-manager, external-dns, auth, rate-limit, body-size, …).
                    type: object
                  className:
                    description: className maps to spec.ingressClassName on the Ingress.
                    type: string
                  enabled:
                    default: false
                    description: enabled toggles rendering of an Ingress for this
                      surface.
                    type: boolean
                  host:
                    description: host is the Ingress host. Required when enabled.
                    type: string
                  path:
                    default: /
                    description: path is the HTTP path to route to this surface.
                    type: string
                  pathType:
                    default: Prefix
                    description: pathType is the Kubernetes Ingress path matching
                      mode.
                    enum:
                    - Exact
                    - Prefix
                    - ImplementationSpecific
                    type: string
                  tls:
                    description: |-
                      tls lists TLS blocks rendered onto the Ingress. secretName may reference a
