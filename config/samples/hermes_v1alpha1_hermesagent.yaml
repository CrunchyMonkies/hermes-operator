apiVersion: hermes.nousresearch.io/v1alpha1
kind: HermesAgent
metadata:
  name: research-bot
  labels:
    app.kubernetes.io/name: hermes-operator
spec:
  image: harbor.bne1.ouchi.com.au/applications/hermes-agent:v2026.5.29.2
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: harbor-pull

  # The default profile: the agent the main container runs at $HERMES_HOME. It
  # uses the shared ProfileConfig — the same object as each entry under profiles[].
  defaultProfile:
    soul: |
      You are a focused research assistant.
    model:
      default: anthropic/claude-opus-4.6
      provider: auto
    agent:
      maxTurns: 60
      reasoningEffort: medium
    compression:
      enabled: true
      threshold: "0.50"
      targetRatio: "0.20"
      protectLastN: 20
    memory:
      memoryEnabled: true
      userProfileEnabled: true
    channels:
      - type: telegram
        enabled: true
        secretRef: { name: research-bot-secrets }
        webhookPort: 0
    skills:
      disabled: []
      enablePackageManagementSkill: true
    runtime:
      terminalBackend: local
      terminalTimeout: 180
      codeExecution:
        timeout: 300
        maxToolCalls: 50

  # Additional profiles: each a complete, independent agent instance in the SAME
  # pod (own gateway + bot token), inheriting any defaultProfile section it omits.
  # Per-profile bot tokens live in the profile's .env, supplied via envSecretRef.
  profiles:
    - name: support
      soul: |
        You are a friendly customer-support agent.
      model:
        default: anthropic/claude-haiku-4.5
      channels:
        - type: telegram
          enabled: true
      # profiles/support/.env (e.g. TELEGRAM_BOT_TOKEN=...) — loaded with override.
      envSecretRef: { name: support-bot-env, key: .env }

  apiServer:
    enabled: true
    host: 0.0.0.0
    port: 8642
    keySecretRef: { name: research-bot-secrets, key: api-server-key }
    service:
      type: ClusterIP
    ingress:
      enabled: true
      className: nginx
      host: api.research-bot.example.com
      path: /
      pathType: Prefix
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "25m"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls:
        - secretName: research-bot-api-tls
          hosts: [api.research-bot.example.com]

  packages:
    brew: [gh, fd]

  envFrom:
    - secretRef: { name: research-bot-secrets }
  authJSONBootstrapSecretRef: { name: research-bot-secrets, key: auth-json }

  serviceAccount:
    create: true
    automountToken: true

  storage:
    size: 20Gi
    reclaimPolicy: Retain

  replicas: 1
  resources:
    requests: { cpu: "500m", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }
  shmSize: 1Gi

  runAsRoot: true
  hermesUID: 10000
  hermesGID: 10000
  fsGroup: 10000

  probes:
    mode: auto
