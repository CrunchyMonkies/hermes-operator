---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hermesconfigpresets.hermes.nousresearch.io
spec:
  group: hermes.nousresearch.io
  names:
    kind: HermesConfigPreset
    listKind: HermesConfigPresetList
    plural: hermesconfigpresets
    singular: hermesconfigpreset
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HermesConfigPreset is the Schema for the hermesconfigpresets
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HermesConfigPresetSpec is a reusable bundle of defaults deep-merged under a
              HermesAgent via presetRef (CR wins). See specification §3.2.
            properties:
              agent:
                description: AgentSpec renders into config.yaml `agent:`.
                properties:
                  disabledToolsets:
                    description: disabledToolsets lists platform toolsets to disable.
                      -> agent.disabled_toolsets
                    items:
                      type: string
                    type: array
                  maxTurns:
                    description: maxTurns is the max tool-calling iterations. -> agent.max_turns
                    format: int32
                    type: integer
                  reasoningEffort:
                    description: reasoningEffort -> agent.reasoning_effort
                    enum:
                    - xhigh
                    - high
                    - medium
                    - low
                    - minimal
                    - none
                    type: string
                type: object
              compression:
                description: CompressionSpec renders into config.yaml `compression:`
                  (hot-reloadable).
                properties:
                  enabled:
                    type: boolean
                  protectFirstN:
                    format: int32
                    type: integer
                  protectLastN:
                    format: int32
                    type: integer
                  targetRatio:
                    type: string
                  threshold:
                    type: string
                type: object
              extraConfig:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              memory:
                description: MemorySpec renders into config.yaml `memory:`.
                properties:
                  memoryEnabled:
                    type: boolean
                  userProfileEnabled:
                    type: boolean
                type: object
              model:
                description: ModelSpec renders into config.yaml `model:`.
                properties:
                  apiMode:
                    description: |-
                      apiMode selects the wire protocol/transport for the endpoint. Optional: same
                      inheritance as baseURL. Known values at tag v2026.5.16: chat_completions,
                      anthropic_messages, codex_responses, bedrock_converse (re-verify on tag bump).
                      -> model.api_mode
                    type: string
                  baseURL:
                    description: |-
                      baseURL is the provider endpoint. Optional: when provider names a
                      customProviders entry it defaults from that entry; set here only to override.
                      -> model.base_url
                    type: string
                  contextLength:
                    description: contextLength is the total context window (hot-reloadable).
                      -> model.context_length
                    format: int64
                    type: integer
                  default:
                    description: default model name, e.g. anthropic/claude-opus-4.6.
                      -> model.default
                    type: string
                  maxTokens:
                    description: maxTokens caps output tokens. -> model.max_tokens
                    format: int64
                    type: integer
                  provider:
                    default: auto
                    description: |-
                      provider routing mode (e.g. auto), or the name of a customProviders entry to
                      make it the active provider — the operator then fills base_url/api_mode from
                      that entry, so they aren't repeated here. -> model.provider
                    type: string
                  providers:
                    description: |-
                      providers declares the model providers available to the agent — hermes
                      built-ins (anthropic/openai/xai/openrouter/…) and/or custom OpenAI-compatible
                      endpoints — with their credentials and per-model context. provider selects the
                      active one by name. See ProviderSpec.
                    items:
                      description: |-
                        ProviderSpec declares one model provider — either a hermes built-in (anthropic,
                        openai, xai, openrouter, …; baseURL omitted, hermes knows the endpoint) or a
                        custom OpenAI-compatible endpoint (baseURL set). Custom entries render into
                        config.yaml `custom_providers:`; built-ins do not (only their credentials are
                        injected). Select the active provider with model.provider == name.
                      properties:
                        apiMode:
                          description: |-
                            apiMode is the wire protocol/transport (chat_completions, anthropic_messages,
                            codex_responses, bedrock_converse). Optional; built-ins infer it.
                          type: string
                        baseURL:
                          description: |-
                            baseURL marks this as a custom OpenAI-compatible endpoint and is rendered into
                            custom_providers[].base_url. Omit for a built-in provider.
                          type: string
                        keyEnv:
                          description: |-
                            keyEnv overrides the env var the API key is injected under. Defaults to the
                            built-in provider's known key env var, or <NAME>_API_KEY for a custom endpoint.
                          type: string
                        keySecretRef:
                          description: |-
                            keySecretRef supplies this provider's API key; the operator injects it as an
                            env var (see keyEnv) on the agent container. Leave unset for OAuth providers
                            (auth via `hermes login`/auth.json) or when the key is wired via spec.env.
                          properties:
                            key:
                              description: key within the Secret holding the value.
                              type: string
                            name:
                              description: name of the Secret.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        models:
                          description: |-
                            models lists this provider's models and their per-model context windows
                            (custom providers only — renders to custom_providers[].models).
                          items:
                            description: ProviderModelSpec is one model under a ProviderSpec.
                            properties:
                              contextLength:
                                description: |-
                                  contextLength is this model's context window in tokens.
                                  -> custom_providers[].models.<name>.context_length
                                format: int64
                                type: integer
                              name:
                                description: name is the model id as the provider
                                  exposes it.
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                        name:
                          description: |-
                            name is the provider id: a hermes built-in name or alias (e.g. anthropic,
                            claude, openai, grok, xai, openrouter, zai, kimi, minimax, deepseek), or an
                            arbitrary name for a custom endpoint.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              packages:
                description: PackagesSpec declares runtime package installation.
                properties:
                  brew:
                    description: brew packages installed to the shared PVC (persisted,
                      no sudo).
                    items:
                      type: string
                    type: array
                  homebrewPrefix:
                    default: /home/linuxbrew/.linuxbrew
                    description: homebrewPrefix overrides the default Homebrew prefix
                      on the PVC.
                    type: string
                  pip:
                    description: |-
                      pip packages installed (via an init container) into the python user-site on
                      the shared PVC, persisted across restarts; the agent imports them via
                      PYTHONPATH. honcho-ai is added automatically when honcho is in use.
                    items:
                      type: string
                    type: array
                  pipImage:
                    default: python:3.13-slim
                    description: |-
                      pipImage is the python image for the pip-install init container (its Python
                      must match the agent's — 3.13 at the pinned hermes tag).
                    type: string
                type: object
              skills:
                description: SkillsSpec controls skill enablement and operator-provided
                  custom skills.
                properties:
                  creationNudgeInterval:
                    default: 15
                    format: int32
                    type: integer
                  custom:
                    description: custom skills written into the PVC and auto-activated.
                    items:
                      description: CustomSkill is an operator-shipped skill written
                        into the PVC and activated.
                      properties:
                        enabled:
                          default: true
                          type: boolean
                        inline:
                          description: inline is the literal SKILL.md content. Mutually
                            exclusive with sourceRef.
                          type: string
                        name:
                          type: string
                        sourceRef:
                          description: |-
                            sourceRef references a ConfigMap or Secret holding SKILL.md (+files).
                            Mutually exclusive with inline.
                          properties:
                            configMapName:
                              type: string
                            secretName:
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  disabled:
                    description: disabled globally disables bundled skills. -> skills.disabled
                    items:
                      type: string
                    type: array
                  enablePackageManagementSkill:
                    default: true
                    description: |-
                      enablePackageManagementSkill ensures the built-in package-management skill
                      is present and enabled.
                    type: boolean
                  externalDirs:
                    description: externalDirs are read-only external skill dirs. ->
                      skills.external_dirs
                    items:
                      type: string
                    type: array
                  platformDisabled:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    description: platformDisabled disables skills per platform. ->
                      skills.platform_disabled
                    type: object
                type: object
            type: object
          status:
            description: HermesConfigPresetStatus defines the observed state of HermesConfigPreset.
            properties:
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
